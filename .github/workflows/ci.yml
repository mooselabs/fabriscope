name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Lint the installer
        run: shellcheck scripts/install.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Theme browser checks
        run: |
          pip install playwright==1.64.0
          playwright install --with-deps chromium
          python3 tests/theme.py --binary target/debug/fabriscope
